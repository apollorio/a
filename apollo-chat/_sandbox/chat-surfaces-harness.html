	transition: background 0.15s, color 0.15s;
}

.ac-msg-actions button:hover {
	background: rgba(var(--txt-rgb, 19, 21, 23), 0.06);
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.8);
}

/* Reply quote */
.ac-reply-quote {
	display: flex;
	align-items: stretch;
	gap: 8px;
	padding: 0;
	border-radius: 0;
	background: transparent;
	margin-bottom: 6px;
	font-size: inherit;
	cursor: pointer;
}

.sent .ac-reply-quote {
	background: transparent;
}

.ac-reply-rail {
	flex: 0 0 2px;
	width: 2px;
	align-self: stretch;
	border-radius: 2px;
	background: currentColor;
	opacity: 0.34;
}

.ac-reply-body {
	min-width: 0;
	flex: 1;
	font-style: italic;
	font-size: 0.78em;
	line-height: 1.35;
	opacity: 0.72;
}

.ac-reply-sender {
	font-weight: 600;
	font-style: italic;
	font-size: inherit;
	margin-bottom: 1px;
}

.ac-reply-text {
	font-style: italic;
	opacity: 0.88;
}

/* Reactions — badge on bubble bottom edge (shell refines position) */
.ac-reactions {
	display: flex;
	gap: 3px;
	margin-top: 0;
	flex-wrap: wrap;
}

.ac-reaction {
	display: inline-flex;
	align-items: center;
	gap: 2px;
	padding: 0 7px;
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.92);
	font-size: 14px;
	cursor: pointer;
	transition: background 0.15s;
}

.ac-reaction:hover {
	background: #fff;
}

.ac-reaction.mine {
	background: #fff;
}

/* Typing indicator */
.ac-typing-indicator {
	display: none;
	align-items: center;
	gap: 3px;
	padding: 12px 16px;
	opacity: 0.5;
}

.ac-typing-indicator.show {
	display: flex;
}

.ac-dot {
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
	animation: ac-typing 1.4s infinite;
}

.ac-dot:nth-child(2) {
	animation-delay: 0.2s;
}

.ac-dot:nth-child(3) {
	animation-delay: 0.4s;
}

@keyframes ac-typing {

	0%,
	60%,
	100% {
		transform: translateY(0);
		opacity: 0.4;
	}

	30% {
		transform: translateY(-4px);
		opacity: 1;
	}
}

/* File/media in messages */
.ac-msg-image img {
	max-width: 240px;
	max-height: 180px;
	border-radius: 12px;
	cursor: pointer;
	display: block;
	margin: 4px 0;
}

.ac-msg-audio audio,
.ac-msg-video video {
	max-width: 260px;
	border-radius: 8px;
	margin: 4px 0;
}

.ac-msg-file {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 8px 12px;
	border-radius: 10px;
	background: rgba(var(--rgb-d), 0.05);
	text-decoration: none;
	color: inherit;
	margin: 4px 0;
}

.ac-file-name {
	font-size: 12.5px;
	font-weight: 600;
}

.ac-file-size {
	font-size: 10.5px;
	opacity: 0.5;
}

/* GIF in messages */
.ac-msg-gif img {
	max-width: 260px;
	max-height: 200px;
	border-radius: 12px;
	cursor: pointer;
	display: block;
	margin: 4px 0;
}

/* Quick react popup */
.ac-quick-react {
	position: absolute;
	bottom: calc(100% + 6px);
	display: flex;
	gap: 4px;
	background: #fff;
	border-radius: 20px;
	padding: 4px 8px;
	z-index: 20;
}

.ac-quick-react span {
	font-size: 20px;
	cursor: pointer;
	padding: 2px 4px;
	border-radius: 8px;
	transition: transform 0.15s, background 0.15s;
}

.ac-quick-react span:hover {
	transform: scale(1.25);
	background: rgba(var(--rgb-d), 0.05);
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
	COMPOSE BAR
	â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.ac-compose {
	background: transparent;
	flex-shrink: 0;
}

.ac-reply-bar {
	display: none;
	align-items: center;
	gap: 8px;
	padding: 8px 14px;
	background: rgba(var(--txt-rgb, 19, 21, 23), 0.03);
}

.ac-reply-bar.show {
	display: flex;
}

.ac-reply-bar>i {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.5);
	font-size: 16px;
}

.ac-reply-bar-text {
	flex: 1;
	min-width: 0;
}

.ac-reply-bar-sender {
	font-size: 11.5px;
	font-weight: 700;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.65);
}

.ac-reply-bar-preview {
	font-size: 12px;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.5);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

.ac-reply-bar-close {
	cursor: pointer;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
	font-size: 16px;
	padding: 4px;
}

.ac-reply-bar-close:hover {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.65);
}

.ac-attach-preview {
	display: none;
	padding: 8px 14px;
	align-items: center;
	gap: 10px;
}

.ac-attach-preview.show {
	display: flex;
}

.ac-attach-preview img {
	width: 48px;
	height: 48px;
	border-radius: 8px;
	object-fit: cover;
}

.ac-attach-name {
	flex: 1;
	font-size: 12px;
	font-weight: 500;
}

.ac-attach-close {
	cursor: pointer;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
	font-size: 18px;
}

.ac-compose-form { /* shell owns */ }

.ac-compose-left {
	display: flex;
	gap: 2px;
	align-items: center;
}

.ac-compose-left .ac-icon-btn {
	background: transparent;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
	width: 34px;
	height: 34px;
	font-size: 18px;
}

.ac-compose-left .ac-icon-btn:hover {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.7);
	background: rgba(var(--txt-rgb, 19, 21, 23), 0.05);
}

.ac-compose-center {
	flex: 1;
	position: relative;
}

.ac-compose-input { /* shell owns */ }

.ac-compose-input:focus {
	border-bottom-color: var(--primary, FF9820);
}

.ac-compose-input::placeholder {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.28);
}

.ac-emoji-trigger {
	position: absolute;
	right: 12px;
	bottom: 10px;
	cursor: pointer;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.3);
	font-size: 18px;
	transition: color 0.2s;
}

.ac-emoji-trigger:hover {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.65);
}

/* Emoji picker */
.ac-emoji-picker {
	display: none;
	position: absolute;
	bottom: calc(100% + 8px);
	right: 0;
	width: 280px;
	max-height: 300px;
	background: #fff;
	border-radius: 14px;
	overflow: hidden;
	z-index: 100;
}

.ac-emoji-picker.show {
	display: block;
}

.ac-emoji-picker-search {
	padding: 8px;
}

.ac-emoji-picker-search input {
	width: 100%;
	border-radius: 0;
	padding: 6px 0;
	font-size: 13px;
	outline: none;
	font-family: inherit;
	background: transparent;
}

.ac-emoji-grid {
	padding: 8px;
	overflow-y: auto;
	max-height: 240px;
	display: flex;
	flex-wrap: wrap;
	gap: 2px;
}

.ac-emoji-category-label {
	width: 100%;
	font-size: 11px;
	font-weight: 700;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.4);
	padding: 6px 4px 2px;
	text-transform: uppercase;
}

.ac-emoji-item {
	width: 36px;
	height: 36px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 22px;
	background: transparent;
	border-radius: 8px;
	cursor: pointer;
	transition: background 0.1s, transform 0.1s;
}

.ac-emoji-item:hover {
	background: rgba(var(--rgb-d), 0.05);
	transform: scale(1.15);
}

/* Send button — shell owns */
.ac-send-btn { /* shell */ }

.ac-send-btn:hover {
	background: #2a2a2a;
	transform: scale(1.05);
}

.ac-send-btn:active {
	transform: scale(0.9);
}

/* GIF button */
.ac-gif-btn {
	position: relative;
}

.ac-gif-label {
	font-size: 11px;
	font-weight: 800;
	letter-spacing: 0.5px;
	text-transform: uppercase;
	line-height: 1;
	padding: 3px 5px;
	border-radius: 5px;
}

.ac-gif-btn:hover .ac-gif-label {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.7);
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
	GIF PICKER
	â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

.ac-gif-picker {
	display: none;
	position: absolute;
	bottom: 64px;
	left: 10px;
	right: 10px;
	max-width: 420px;
	height: 380px;
	background: var(--bg, #fff);
	border-radius: 16px;
	z-index: 90;
	flex-direction: column;
	overflow: hidden;
}

.ac-gif-picker.show {
	display: flex;
}

.ac-gif-header {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 10px 12px;
}

.ac-gif-header i {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
	font-size: 16px;
}

.ac-gif-search {
	flex: 1;
	border-radius: 0;
	padding: 7px 0;
	font-size: 13px;
	outline: none;
	font-family: inherit;
	background: transparent;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.85);
}

.ac-gif-search:focus {
	border-bottom-color: var(--primary, FF9820);
}

.ac-gif-grid {
	flex: 1;
	overflow-y: auto;
	padding: 8px;
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 6px;
	align-content: start;
}

.ac-gif-item {
	border-radius: 10px;
	overflow: hidden;
	cursor: pointer;
	background: rgba(var(--rgb-d), 0.04);
	aspect-ratio: 16/12;
	transition: transform 0.15s, box-shadow 0.15s;
}

.ac-gif-item:hover {
	transform: scale(1.03);
}

.ac-gif-item img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	display: block;
}

.ac-gif-footer {
	padding: 6px 12px;
	display: flex;
	justify-content: flex-end;
	opacity: 0.6;
}

.ac-gif-loading,
.ac-gif-empty {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 8px;
	padding: 40px 20px;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
	grid-column: 1 / -1;
}

.ac-gif-empty i {
	font-size: 32px;
}

.ac-gif-empty p {
	font-size: 13px;
	margin: 0;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
	OVERLAYS
	â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

/* Search overlay — GSAP owns the open (clip-path + blur + scale).
   Default is display:none so it stays out of the a11y tree; .show
   (and the motion engine) flips it to flex. */
.ac-search-overlay {
	display: none;
	position: absolute;
	inset: 0;
	z-index: 70;
	background: rgba(var(--ac-ground-rgb, 240, 240, 243), 0.86);
	backdrop-filter: blur(28px) saturate(1.22);
	-webkit-backdrop-filter: blur(28px) saturate(1.22);
	flex-direction: column;
	overflow: hidden;
	isolation: isolate;
	will-change: clip-path, opacity, filter, transform;
}

.ac-search-overlay.show {
	display: flex;
}

.ac-search-header {
	display: flex;
	align-items: center;
	gap: 10px;
	margin: 12px 14px 8px;
	padding: 8px 10px 8px 14px;
	border-radius: 22px;
	background: var(--ac-raise, #fff);
	box-shadow: var(--ac-bevel), var(--ac-lift);
	will-change: transform, opacity, filter;
}

.ac-search-header i {
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.4);
	font-size: 18px;
}

.ac-search-header input {
	flex: 1;
	outline: none;
	font-size: 14px;
	font-family: inherit;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.85);
	background: transparent;
}

.ac-search-results {
	flex: 1;
	overflow-y: auto;
	padding: 8px 0;
}

.ac-search-result {
	display: flex;
	flex-direction: column;
	padding: 10px 16px;
	cursor: pointer;
	gap: 2px;
	transition: background 0.15s;
}

.ac-search-result:hover {
	background: rgba(var(--rgb-d), 0.03);
}

.ac-result-sender {
	font-size: 12px;
	font-weight: 700;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.65);
}

.ac-result-text {
	font-size: 13px;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.7);
}

.ac-result-time {
	font-size: 10.5px;
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.35);
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
	MODAL
	â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.ac-modal-overlay {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 1000;
	background: rgba(18, 18, 20, 0.4);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	align-items: center;
	justify-content: center;
	padding: 20px;
}

.ac-modal-overlay.show {
	display: flex;
}

.ac-modal {
	background: var(--bg, #fff);
	border-radius: 16px;
	width: 100%;
	max-width: 440px;
	max-height: 85vh;
	display: flex;
	flex-direction: column;
	overflow: hidden;
	transform: translateY(-8px) scale(0.98);
	transition: transform 0.35s cubic-bezier(.16, 1, .3, 1);
}
.ac-modal-overlay.show .ac-modal {
	transform: translateY(0) scale(1);
}

.ac-modal-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 16px 20px;
}

.ac-modal-header h3 {
	font-family: var(--ff-mono, "Space Mono", monospace);
	font-size: 16px;
	font-weight: 700;
	color: var(--txt-color-hover, rgba(19, 21, 23, 0.92));
	margin: 0;
}

.ac-modal-close {
	width: 36px;
	height: 36px;
	background: var(--bg, #fff);
	color: var(--txt-color, rgba(19, 21, 23, 0.77));
	border-radius: 50%;
	font-size: 18px;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: all 0.25s cubic-bezier(.16, 1, .3, 1);
}

.ac-modal-close:hover {
	background: var(--surface, rgba(var(--rgb-d),0.025));
	color: var(--txt-color-hover, rgba(19, 21, 23, 0.92));
}

.ac-modal-body {
	padding: 16px 20px;
	overflow-y: auto;
	flex: 1;
	min-height: 0;
}

.ac-modal-footer {
	display: flex;
	align-items: center;
	justify-content: flex-end;
	gap: 10px;
	padding: 12px 20px;
}

/* Inputs inside modals */
.ac-input {
	width: 100%;
	border-radius: 0;
	padding: 12px 0;
	font-size: 16px;
	font-family: var(--ff-main, "Space Grotesk", system-ui, sans-serif);
	outline: none;
	transition: border-bottom-color 0.25s cubic-bezier(.16, 1, .3, 1);
	color: var(--black-1, #131517);
	background: transparent;
	margin-bottom: 8px;
}

.ac-input:focus {
	border-bottom-color: var(--primary, FF9820);
}

.ac-input::placeholder {
	color: var(--muted, rgba(19,21,23,0.45));
}

.ac-textarea {
	resize: none;
	min-height: 60px;
	margin-top: 8px;
}

.ac-selected-tags {
	display: flex;
	flex-wrap: wrap;
	gap: 4px;
	margin-bottom: 8px;
}

.ac-selected-tag {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	padding: 4px 10px;
	border-radius: 16px;
	background: rgba(var(--txt-rgb, 19, 21, 23), 0.08);
	color: rgba(var(--txt-rgb, 19, 21, 23), 0.7);
	font-size: 12px;
	font-weight: 600;
}

.ac-tag-remove {
	cursor: pointer;
	font-size: 14px;
	opacity: 0.6;
}

.ac-tag-remove:hover {
	opacity: 1;
}

/* User list items in modals */
.ac-user-list {
	max-height: 200px;
	overflow-y: auto;
}

.ac-user-item {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 8px 10px;
	cursor: pointer;
	border-radius: 10px;
	transition: background 0.15s cubic-bezier(.16, 1, .3, 1);
}

.ac-user-item:hover {
	background: var(--surface, rgba(var(--rgb-d),0.025));
}

.ac-user-item.selected {
	background: var(--card-hover, rgba(var(--rgb-d),0.045));
}

.ac-user-item img {
	width: 36px;
	height: 36px;
	border-radius: 50%;
	object-fit: cover;
}

/* Buttons */
.ac-btn {
	padding: 8px 18px;
	border-radius: 10px;
	background: var(--bg, #fff);
	font-family: var(--ff-main, "Space Grotesk", system-ui, sans-serif);
	font-size: 13px;
	font-weight: 600;
	cursor: pointer;
	transition: all 0.25s cubic-bezier(.16, 1, .3, 1);
	color: var(--txt-color, rgba(19, 21, 23, 0.77));
}

.ac-btn:hover {
	background: var(--surface, rgba(var(--rgb-d),0.025));
}

.ac-btn:active {
	transform: scale(0.97);
}

.ac-btn-primary {
	background: var(--black-1, #131517);
	color: var(--bg, #fff);
}

.ac-btn-primary:hover {
	opacity: 0.85;
	background: var(--black-1, #131517);
}

/* ===== Chat Modal — Dark Mode ===== */
html.dark-mode .ac-modal-overlay {
	background: rgba(var(--rgb-d), 0.55);
}
html.dark-mode .ac-modal {
	background: var(--bg, #0f0f11);
}
html.dark-mode .ac-modal-header {
	border-bottom-color: var(--border, rgba(var(--rgb-t),0.10));
}
html.dark-mode .ac-modal-header h3 {
	color: var(--txt-color-hover, rgba(var(--rgb-t),0.92));
}
html.dark-mode .ac-modal-close {
	background: var(--bg, #0f0f11);
	color: var(--txt-color, rgba(var(--rgb-t),0.77));
}
html.dark-mode .ac-modal-close:hover {
	background: var(--surface, rgba(var(--rgb-t),0.06));
	color: var(--txt-color-hover, rgba(var(--rgb-t),0.92));
}
html.dark-mode .ac-modal-footer {
	border-top-color: var(--border, rgba(var(--rgb-t),0.10));
}
html.dark-mode .ac-input {
	border-bottom-color: var(--border, rgba(var(--rgb-t),0.10));
	color: var(--txt-color-hover, rgba(var(--rgb-t),0.92));
}
html.dark-mode .ac-input::placeholder {

.ac-chat-header[hidden],
.ac-compose[hidden] {
	display: none !important;
}

/* The band itself stays a transparent positioning frame — but it now carries
   a scrim, so messages scrolling under the chip DISSOLVE into the ground
   instead of sliding out from behind a hard edge. Without this the chip has
   to be opaque to stay readable, which is what forced white-on-white.
   (min-height/background/box-shadow were re-declared a second time at the
   foot of this file under "Kill premium dead-band header" — folded in here,
   2026-09-12. Do not re-add that block.) */
.ac-chat-header {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	z-index: 6;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: calc(10px + env(safe-area-inset-top, 0px)) var(--ac-pad-x-msg) 0;
	pointer-events: none;
	background: transparent !important;
	min-height: 0 !important;
	box-shadow: none !important;
	-webkit-backdrop-filter: none;
	backdrop-filter: none;
}

.ac-chat-header::before {
	content: '';
	position: absolute;
	inset: 0 0 -28px;
	pointer-events: none;
	z-index: -1;
	background: linear-gradient(
		to bottom,
		rgba(var(--ac-ground-rgb), 1) 0%,
		rgba(var(--ac-ground-rgb), 0.92) 46%,
		rgba(var(--ac-ground-rgb), 0) 100%
	);
}

/* The chip: elevated paper on the recessed ground. Identity first — this is
   the answer to "who am I talking to", so it gets the strongest elevation on
   the screen after the send button. */
.ac-peer-chip {
	pointer-events: auto;
	display: flex;
	align-items: center;
	gap: 11px;
	max-width: min(420px, 100%);
	padding: 7px 8px 7px 7px;
	border-radius: 999px;
	/* Real glass, not opaque-white-pretending: the backdrop-filter below only
	   does something if the fill lets the ground through. The scrim on
	   .ac-chat-header::before is what keeps the name legible while messages
	   scroll underneath, which is why the fill can afford to be this light.
	   Falls back to ~78% white over the ground where backdrop-filter is
	   unsupported — still a visible step, never white-on-white. */
	background: linear-gradient(
		180deg,
		rgba(255, 255, 255, 0.86) 0%,
		rgba(255, 255, 255, 0.72) 100%
	);
	border: 0;
	box-shadow: var(--ac-bevel), var(--ac-lift);
	-webkit-backdrop-filter: blur(20px) saturate(180%);
	backdrop-filter: blur(20px) saturate(180%);
	transition: box-shadow 0.3s var(--ac-ease), transform 0.3s var(--ac-ease);
	animation: ac-chip-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.ac-peer-chip:hover {
	box-shadow: var(--ac-bevel), var(--ac-lift-hi);
}

@keyframes ac-chip-in {
	from { opacity: 0; transform: translateY(-8px) scale(0.96); }
	to   { opacity: 1; transform: translateY(0) scale(1); }
}

.ac-chat-header .ac-back-btn,
.ac-chat-header .ac-icon-btn {
	background: transparent !important;
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.45) !important;
	width: 34px;
	height: 34px;
	border: 0;
	transition: background 0.2s var(--ac-ease), color 0.2s var(--ac-ease);
}

/* Actions are quiet until wanted — an always-on grey pill next to the name
   competes with the identity it is attached to. */
.ac-chat-header .ac-back-btn:hover,
.ac-chat-header .ac-icon-btn:hover {
	background: rgba(var(--txt-rgb, 29, 29, 31), 0.06) !important;
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.82) !important;
}

.ac-chat-header .navbar-highlighted {
	color: rgba(29, 29, 31, 0.78) !important;
	mix-blend-mode: normal !important;
	filter: none !important;
}

/* overflow:hidden stays on an inner ring, NOT here — the online dot is a
   child and must be allowed to sit on the avatar's edge. */
.ac-header-avatar {
	width: 36px;
	height: 36px;
	border-radius: 50%;
	position: relative;
	flex-shrink: 0;
	background: var(--ac-ground-2);
	box-shadow:
		inset 0 0 0 1px rgba(var(--txt-rgb, 29, 29, 31), 0.06),
		0 1px 2px -1px rgba(var(--txt-rgb, 29, 29, 31), 0.25);
}

.ac-header-avatar img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	display: block;
	border-radius: 50%;
}

.ac-header-info {
	flex: 1;
	min-width: 0;
	padding-right: 4px;
}

/* Display type: the name is the loudest thing in the chip. */
.ac-header-name {
	font-family: var(--ff-heading, var(--ff-main, inherit));
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.95);
	font-weight: 700;
	font-size: 14px;
	letter-spacing: -0.025em;
	line-height: 1.15;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

/* Mono eyebrow, per DS: uppercase, wide tracking, muted, tiny. Reads as
   metadata rather than as a second, weaker name. */
.ac-header-status {
	font-family: var(--ac-eyebrow-ff);
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.38);
	font-size: 9.5px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.12em;
	line-height: 1.25;
	margin-top: 2px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

/* The handle — lowercase, so it stays copy-pasteable as a real @login. */
.ac-header-status .ac-header-handle {
	text-transform: lowercase;
	letter-spacing: 0.02em;
	opacity: 0.82;
}

.ac-header-status .ac-header-sep {
	opacity: 0.4;
	margin: 0 5px;
}

.ac-header-status.online {
	color: #12905c;
}

.ac-header-actions {
	display: flex;
	gap: 2px;
	flex-shrink: 0;
}

/* Messages — ONLY this pane scrolls */
.ac-messages {
	flex: 1 1 auto;
	min-height: 0;
	overflow-x: hidden;
	overflow-y: auto;
	-webkit-overflow-scrolling: touch;
	overscroll-behavior: contain;
	/* Top clears floating peer chip; bottom clears composer dock */
	padding: 64px var(--ac-pad-x-msg) calc(92px + env(safe-area-inset-bottom, 0px));
	gap: 4px;
	/* THE ground. Every elevated surface on this screen is measured against
	   it. The inline critical block in templates/chat.php references the same
	   token — it is later in the cascade and would otherwise win. */
	background: var(--ac-ground) !important;
}

.ac-empty-chat {
	color: rgba(29, 29, 31, 0.35);
}

.ac-empty-icon {
	background: rgba(29, 29, 31, 0.04);
}

.ac-empty-icon i {
	color: rgba(29, 29, 31, 0.28);
}

.ac-empty-chat p {
	color: rgba(29, 29, 31, 0.55);
	font-weight: 600;
	letter-spacing: -0.02em;
}

/* Date rule — a ruled break in the transcript, not a floating grey pill.
   The 4%-black pill it replaced was invisible against white and would be
   invisible against the ground too. */
.ac-date-sep {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 14px 2px 10px;
}

.ac-date-sep::before,
.ac-date-sep::after {
	content: '';
	flex: 1;
	height: 1px;
	background: linear-gradient(
		to right,
		rgba(var(--txt-rgb, 29, 29, 31), 0),
		rgba(var(--txt-rgb, 29, 29, 31), 0.1)
	);
}

.ac-date-sep::after {
	background: linear-gradient(
		to left,
		rgba(var(--txt-rgb, 29, 29, 31), 0),
		rgba(var(--txt-rgb, 29, 29, 31), 0.1)
	);
}

.ac-date-sep span {
	background: none;
	border-radius: 0;
	padding: 0;
	flex: 0 0 auto;
	font-family: var(--ac-eyebrow-ff);
	font-size: 9.5px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.14em;
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.36);
}

.ac-msg-row {
	max-width: min(82%, 480px);
	position: relative;
}

.ac-msg-row.has-reactions {
	margin-bottom: 10px;
}

.ac-bubble {
	padding: 9px 13px;
	border-radius: 18px;
	font-size: 14px;
	line-height: 1.42;
	letter-spacing: -0.015em;
	position: relative;
	overflow: visible;
}

/* Reply quote — full-height rail + italic smaller body */
.ac-reply-quote {
	display: flex;
	align-items: stretch;
	gap: 8px;
	margin: 0 0 6px;
	padding: 0;
	border-radius: 0;
	background: transparent !important;
	cursor: pointer;
}

.ac-reply-rail {
	flex: 0 0 2px;
	width: 2px;
	align-self: stretch;
	border-radius: 2px;
	background: currentColor;
	opacity: 0.34;
}

.ac-reply-body {
	min-width: 0;
	flex: 1;
	font-style: italic;
	font-size: 0.78em;
	line-height: 1.35;
	letter-spacing: -0.01em;
	color: inherit;
	opacity: 0.72;
}

.ac-reply-sender {
	font-weight: 600;
	font-style: italic;
	font-size: inherit;
	margin: 0 0 1px;
	opacity: 0.95;
}

.ac-reply-text {
	font-style: italic;
	opacity: 0.88;
	white-space: pre-wrap;
	word-break: break-word;
}

.sent .ac-reply-quote {
	background: transparent !important;
}

.sent .ac-reply-rail {
	opacity: 0.42;
	background: rgba(255, 255, 255, 0.55);
}

.sent .ac-reply-body {
	color: rgba(255, 255, 255, 0.78);
}

/* Reactions — sit on bottom edge, 50% overlap, inset from left */
.ac-reactions {
	position: absolute;
	left: var(--ac-react-inset);
	bottom: 0;
	transform: translateY(50%);
	display: flex;
	flex-wrap: wrap;
	gap: 3px;
	margin: 0;
	padding: 0;
	z-index: 3;
	pointer-events: auto;
}

.ac-reaction {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 2px;
	min-width: 26px;
	height: 26px;
	padding: 0 7px;
	border-radius: 999px;
	/* Straddles the bubble edge and the ground behind it, so it needs to be
	   opaque and lifted or it vanishes into whichever it overlaps.
	   No backdrop-filter — that was removed deliberately (crisp emoji). */
	background: var(--ac-raise);
	box-shadow:
		inset 0 0 0 1px rgba(var(--txt-rgb, 29, 29, 31), 0.05),
		0 2px 6px -2px rgba(var(--txt-rgb, 29, 29, 31), 0.18);
	font-size: 14px;
	line-height: 1;
	cursor: pointer;
	will-change: transform;
	transform-origin: 50% 50%;
}

.ac-reaction .count {
	font-size: 10px;
	font-weight: 600;
	font-style: normal;
	opacity: 0.55;
	letter-spacing: -0.02em;
}

/* Deliberately chrome-less (see 0fccfcd "crisp emoji reactions") — so they
   also opt out of the chip lift added to .ac-reaction above. */
.ac-reaction.mine {
	background: transparent;
	box-shadow: none;
}

.sent .ac-reaction {
	background: transparent;
	box-shadow: none;
	color: rgba(255, 255, 255, 0.92);
}

/* Ink on the ground. The gradient is 4% top-to-bottom — invisible as a
   gradient, but it stops a large dark bubble reading as a flat sticker. */
.sent .ac-bubble {
	background: linear-gradient(170deg, #1c1c20 0%, #111113 100%);
	color: #f5f5f7;
	border-bottom-right-radius: 6px;
	box-shadow:
		inset 0 1px 0 0 rgba(255, 255, 255, 0.07),
		0 1px 2px -1px rgba(17, 17, 19, 0.4),
		0 10px 24px -14px rgba(17, 17, 19, 0.6);
}

/* Paper on the ground. The old #f2f2f4-on-#fff pair was actually the least
   broken thing here (1.118:1 — the chip and the composer were 1.000:1), so
   this is not a contrast fix: once the pane became the ground, a near-white
   bubble ON it inverted the figure/ground reading. Received messages are the
   paper now; the ground stays behind them. */
.received .ac-bubble {
	background: var(--ac-raise);
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.9);
	border-bottom-left-radius: 6px;
	box-shadow:
		inset 0 0 0 1px rgba(var(--txt-rgb, 29, 29, 31), 0.045),
		0 1px 2px -1px rgba(var(--txt-rgb, 29, 29, 31), 0.12),
		0 8px 20px -16px rgba(var(--txt-rgb, 29, 29, 31), 0.3);
}

/* ── Composer dock — elevated, high-contrast, always readable ── */
.ac-compose {
	flex-shrink: 0;
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 8;
	display: flex;
	flex-direction: column;
	padding: 0 var(--ac-pad-x-msg) calc(12px + env(safe-area-inset-bottom, 0px));
	pointer-events: none;
	background: transparent !important;
	animation: ac-compose-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes ac-compose-in {
	from { opacity: 0; transform: translateY(12px); }
	to   { opacity: 1; transform: translateY(0); }
}

/* Bottom scrim — mirror of .ac-chat-header::before. Messages dissolve into
   the ground under the dock instead of being guillotined by its edge. */
.ac-compose::before {
	content: '';
	position: absolute;
	inset: -36px 0 0;
	pointer-events: none;
	z-index: -1;
	background: linear-gradient(
		to top,
		rgba(var(--ac-ground-rgb), 1) 0%,
		rgba(var(--ac-ground-rgb), 0.92) 52%,
		rgba(var(--ac-ground-rgb), 0) 100%
	);
}

/* The composer is the other half of the user's complaint: a white field on a
   white pane, outlined by a hairline. Now it is a milled capsule of elevated
   paper — bevel + two-layer lift — and it RESPONDS: focus raises it and lights
   the ring. Before this there was no focus affordance at all (the input sets
   outline:none with nothing put back), which is both a luxury-grade miss and
   an accessibility one. */
.ac-compose-form {
	pointer-events: auto;
	display: flex;
	align-items: flex-end;
	gap: 10px;
	padding: 8px 8px 8px 16px;
	min-height: 56px;
	border-radius: 28px;
	background: var(--ac-raise) !important;
	border: 0;
	box-shadow: var(--ac-bevel), var(--ac-lift-hi);
	transition: box-shadow 0.32s var(--ac-ease), transform 0.32s var(--ac-ease);
}

.ac-compose-form:focus-within {
	transform: translateY(-1px);
	box-shadow:
		var(--ac-bevel),
		var(--ac-lift-hi),
		0 0 0 3px var(--ac-ring);
}

.ac-compose-center {
	flex: 1;
	position: relative;
	min-width: 0;
}

.ac-compose-input {
	width: 100%;
	display: block;
	background: transparent !important;
	border: 0 !important;
	outline: none !important;
	border-radius: 0 !important;
	padding: 10px 40px 10px 0 !important;
	min-height: 40px;
	max-height: 120px;
	resize: none;
	font-family: inherit;
	font-size: 14.5px;
	line-height: 1.4;
	letter-spacing: -0.01em;
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.92) !important;
	caret-color: var(--primary, #ff9820);
	box-shadow: none !important;
}

.ac-compose-input::placeholder {
	color: rgba(var(--txt-rgb, 29, 29, 31), 0.3);
	letter-spacing: -0.005em;
}

.ac-emoji-trigger {
	position: absolute;
	right: 2px;
	bottom: 8px;
	width: 32px;
	height: 32px;
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	color: rgba(29, 29, 31, 0.32);
	font-size: 18px;
	border-radius: 50%;
	transition: color 0.2s, background 0.2s;
}

.ac-emoji-trigger:hover {
	color: rgba(29, 29, 31, 0.7);
	background: rgba(29, 29, 31, 0.04);
}

.ac-send-btn,
button.ac-send-btn {
	pointer-events: auto;
	flex-shrink: 0;
	width: 44px !important;
	height: 44px !important;
	border: 0 !important;
	outline: none !important;
	border-radius: 50% !important;
	background: #111113 !important;
	color: #fff !important;
	font-size: 18px;
	cursor: pointer;
	display: flex !important;
	align-items: center;
	justify-content: center;
	box-shadow: 0 8px 20px -10px rgba(17, 17, 19, 0.7);
	transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s;
}

.ac-send-btn:hover,
button.ac-send-btn:hover {
	background: #2a2a2e !important;
	transform: scale(1.05);
}

.ac-send-btn:active,
button.ac-send-btn:active {
	transform: scale(0.92);
}

.ac-send-btn i {
	color: #fff !important;
	line-height: 1;
}

.ac-reply-bar {
	pointer-events: auto;
	background: rgba(255, 255, 255, 0.94);
	border: 1px solid rgba(29, 29, 31, 0.07);
	border-radius: 16px;
	margin-bottom: 8px;
	padding: 8px 12px;
	box-shadow: 0 8px 20px -14px rgba(29, 29, 31, 0.25);
}

/* Modals / menus stay light */
.ac-context-menu,
.ac-thread-menu,
.ac-modal,
.ac-modal-card {
	background: var(--ac-surface);
}

.ac-spinner {
	border-top-color: #1d1d1f;
}

/* Scrollbars — quiet */
.ac-thread-list::-webkit-scrollbar,
.ac-messages::-webkit-scrollbar {
	width: 6px;
}

.ac-thread-list::-webkit-scrollbar-thumb,
.ac-messages::-webkit-scrollbar-thumb {
	background: rgba(var(--txt-rgb, 29, 29, 31), 0.12);
	border-radius: 99px;
}

/* ── Mobile app shell ── */
@media (max-width: 767px) {
	:root {
		--ac-pad-x: 12px;
		--ac-pad-x-msg: 12px;
		--ac-react-inset: 7px;
	}

	.ac-sidebar {
		width: 100%;
		height: 100%;
	}

	/* background omitted on purpose — the base .ac-main declaration owns the
	   ground (2026-09-12). Re-stating it here is how it ended up as three
	   different whites in three blocks. */
	.ac-main {
		position: fixed;
		top: var(--ac-nav-h);
		left: 0;
		right: 0;
		bottom: 0;
		height: auto;
		max-height: none;
		z-index: 90;
	}

	.ac-messages {
		padding-left: var(--ac-pad-x-msg);
		padding-right: var(--ac-pad-x-msg);
	}

	.ac-chat-header {
		padding-left: var(--ac-pad-x);
		padding-right: var(--ac-pad-x);
	}

	.ac-peer-chip {
		max-width: 100%;
		width: 100%;
		border-radius: 18px;
	}

	.ac-compose {
		padding-left: var(--ac-pad-x);
		padding-right: var(--ac-pad-x);
	}
}

/* ── Desktop: split panes, still no document scroll ── */
@media (min-width: 768px) {
	:root {
		--ac-pad-x: 16px;
		--ac-pad-x-msg: 22px;
		--ac-react-inset: 9px;
	}

	/* No background overrides here: the base declarations own the ground for
	   both of these. They used to repaint it white at >=768px, which is how
	   the same surface ended up with two different answers depending on
	   viewport width (2026-09-12). */
	.ac-layout {
		flex-direction: row;
		max-width: none;
		width: 100%;
		height: 100%;
		margin: 0;
	}

	/* Paper pane against the conversation's recessed ground. That contrast IS
	   the divider — no 1px rule between the columns, by design. */
	.ac-sidebar {
		width: min(34%, 380px);
		min-width: 300px;
		max-width: 400px;
		flex: none;
		height: 100%;
		background: var(--ac-surface);
		position: relative;
		z-index: 2;
		box-shadow:
			1px 0 0 rgba(var(--txt-rgb, 29, 29, 31), 0.04),
			8px 0 24px -18px rgba(var(--txt-rgb, 29, 29, 31), 0.55);
	}

	.ac-sidebar.hidden {
		transform: none;
		position: relative;
	}

	.ac-sidebar-header {
		padding: 14px var(--ac-pad-x) 10px;
		background: var(--ac-surface) !important;
	}

	/* background: see the mobile note — base .ac-main owns it. */
	.ac-main {
		display: flex;
		flex: 1;
		height: 100%;
		min-height: 0;
	}

	.ac-chat-header {
		padding: 12px var(--ac-pad-x-msg) 0;
		background: transparent !important;
	}

	.ac-chat-header .ac-back-btn {
		display: none;
	}

	.ac-messages {
		padding: 68px var(--ac-pad-x-msg) 100px;
	}

	.ac-compose {
		padding: 0 var(--ac-pad-x-msg) 18px;
		background: transparent !important;
	}
}

@media (min-width: 1100px) {
	:root {
		--ac-pad-x-msg: 28px;
	}

	.ac-messages {
		padding-left: var(--ac-pad-x-msg);
		padding-right: var(--ac-pad-x-msg);
	}

	.ac-msg-row {
		max-width: min(68%, 520px);
	}
}

/* ═══════════════════════════════════════════════════════════
   Apollo glass panels (base-dropdowns standard)
   ═══════════════════════════════════════════════════════════ */
.ac-glass-panel {
	background: linear-gradient(
		186deg,
		rgba(var(--rgb-theme, 255, 255, 255), 0.35),
		rgba(var(--rgb-theme, 255, 255, 255), 1) 90%,
		rgb(var(--rgb-theme, 255, 255, 255)) 100%
	) !important;
	color: var(--txt-color, rgba(29, 29, 31, 0.72));
	backdrop-filter: blur(125px) brightness(1.65) saturate(1.3);
	-webkit-backdrop-filter: blur(125px) brightness(1.65) saturate(1.3);
}

.ac-context-menu.ac-glass-panel,
.ac-thread-menu.ac-glass-panel {
	padding: 6px 0;
	min-width: 188px;
	border-radius: 16px;
	overflow: hidden;
	will-change: transform, opacity, filter, clip-path;
}

.ac-ctx-item {
	display: flex;
	align-items: center;
	gap: 10px;
	padding: 10px 14px;
	cursor: pointer;
	font-size: 13px;
	color: var(--txt-color, rgba(29, 29, 31, 0.78));
	transition: background 0.15s var(--ease, cubic-bezier(0.16, 1, 0.3, 1));
}

.ac-ctx-item i {
	font-size: 16px;
	width: 18px;
	text-align: center;
	opacity: 0.85;
}

.ac-ctx-item:hover {
