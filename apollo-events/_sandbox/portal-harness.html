<style id="sandbox-token-stub">
:root{
  --rgb-theme:255,255,255; --rgb-diff:10,10,10; --rgb-accent:255,107,53;
  --bg:#fff; --card:#fff; --surface:#f7f6f4; --surface-hover:#efeeea;
  --txt-color:#2b2b2b; --txt-heading:#0a0a0a; --muted:#8a8a8a;
  --muted-txt:#8a8a8a; --muted-bg:#e8e8e8;
  --accent:#ff6b35; --primary:#ff6b35; --alert-red:#ff6b6b;
  --white-1:#fff; --white-2:rgba(10,10,10,.02); --white-3:rgba(10,10,10,.04);
  --white-6:rgba(10,10,10,.10); --white-7:rgba(10,10,10,.12); --white-13:rgba(10,10,10,.24);
  --gray-18:#5a5a5a; --black-1:#121214; --orange-700:#e2551f;
  --ff-main:"Space Grotesk",system-ui,sans-serif; --ff-heading:"Space Grotesk",system-ui,sans-serif;
  --ff-mono:"Space Mono",ui-monospace,monospace;
  --fs-h1:clamp(2.15rem,8.5vw,3.1rem); --fs-h6:1rem; --fs-body-sm:.875rem;
  --fs-r:1; --fs-u:1;
  --r:16px; --r-lg:20px; --r-sm:12px; --r-xs:8px; --r-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1); --ease-snappy:cubic-bezier(.34,1.16,.64,1); --ease-smooth:cubic-bezier(.16,1,.3,1);
  --safe-top:0px; --safe-bottom:0px;
  --card-hover:#f2f1ee;
}
html,body{margin:0}
body{background:var(--bg);font-family:var(--ff-main);-webkit-font-smoothing:antialiased}
/* Sandbox-only ruler: paints the header band so overlap is visible by eye. */
body.show-rail .alh{outline:1px dashed rgba(255,0,128,.55);outline-offset:-1px}
body.show-rail .pev-hero{outline:1px dashed rgba(0,140,255,.55);outline-offset:-1px}
</style>
<style id="sandbox-btn-stub">

.pev, .ax-main { --fsx: var(--fs-u, 1); }

<style id="apollo-plus-topbar">
/* ═══ APP SHELL — estrutura EXATA de apollo.theme.showcase.html ═══ */
.ax-body { padding-top: 56px; }
.ax-top-blur { position: fixed; inset: 0 0 auto 0; height: 78px; z-index: 9900; pointer-events: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: linear-gradient(to bottom, rgba(var(--rgb-theme),1) 0%, rgba(var(--rgb-theme),.4) 50%, transparent 100%); -webkit-mask: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.7) 45%, transparent 100%); mask: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.7) 45%, transparent 100%); }
.ax-top { position: fixed; top: 2px; left: 0; right: 13px; z-index: 9901; height: 56px; display: flex; align-items: center; gap: 6px; padding: 0 clamp(8px,2vw,16px); padding-top: var(--safe-top); }
.ax-top-l, .ax-top-r { display: flex; align-items: center; }
.ax-top-r { margin-left: auto; gap: 2px; }
.ax-burger { display: flex; width: 44px; height: 44px; border-radius: var(--r-pill); align-items: center; justify-content: center; color: var(--txt-heading); cursor: pointer; }

.ax-burger i { font-size: calc(var(--fs-r, 1) * 1.4rem); }
.ax-brand { display: flex; align-items: center; gap: 7px; font-family: var(--ff-mono); font-size: calc(var(--fs-r, 1) * .75rem); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--txt-heading); }
.ax-brand i { color: var(--txt-heading); font-size: calc(var(--fs-r, 1) * 1.1rem); }
.ax-brand b { color: var(--muted); }
.ax-ic { width: calc(var(--fs-r, 1) * 1.75rem); aspect-ratio: 1/1; height: auto; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; color: var(--txt-color); cursor: pointer; position: relative; font-size: calc(var(--fs-r, 1) * 1.15rem); transition: all .35s var(--ease); }
#ic-apps { margin: 0 8px 0 0px!important; }
#ic-pf { transform: scale(1.2)!important; }
.ax-ic:hover { color: var(--txt-heading); background: var(--surface); }
/* Topbar nav icon glyphs — 22px em box (header only; .ax-ic in panels untouched) */
.ax-top .ax-burger,
.ax-top .ax-top-r .ax-ic,
.ax-top .ax-top-r .ax-login { font-size: calc(var(--fs-r, 1) * 22px); }
.ax-top .ax-burger > svg,
.ax-top .ax-burger > i,
.ax-top .ax-top-r .ax-ic > svg,
.ax-top .ax-top-r .ax-ic > i,
.ax-top .ax-top-r .ax-login > svg,
.ax-top .ax-top-r .ax-login > i { width: 1em; height: 1em; font-size: inherit; flex-shrink: 0; display: block; line-height: 1; }
.ax-dot { position: absolute; top: calc(var(--fs-r, 1) * .73rem); right: calc(var(--fs-r, 1) * .755rem); width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(255,122,0,.8); animation: pulse 5.5s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,122,0,.5); filter: brightness(1.35); } 35% { box-shadow: 0 0 0 13px rgba(255,122,0,0); } 100% { box-shadow: 0 0 0 13px rgba(255,122,0,0); filter: brightness(1); } }
.ax-avb { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; margin-left: 4px; cursor: pointer; background: var(--card); flex-shrink: 0; border: 1px solid rgba(5,5,5,.04); box-shadow: rgba(0,0,0,.12) 0px 0px 0px 1px inset, rgba(0,0,0,.25) 0px 1px 0px 0px inset; display: flex; align-items: center; justify-content: center; }
.ax-avb img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); box-shadow: none; }
.ax-avb:hover img { filter: grayscale(0); }
.ax-avb-init { font-family: var(--ff-mono); font-size: calc(var(--fs-r, 1) * 10px); font-weight: 700; color: var(--txt-heading); text-transform: uppercase; letter-spacing: .04em; }
.ax-top-brand { display: flex; align-items: center; gap: 9px; }
.ax-top-logo { width: 20px; height: 20px; border-radius: 50%; background: var(--black-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ax-top-logo i { font-size: calc(var(--fs-r, 1) * 12px); color: var(--bg); }
.ax-top-wm { font-size: calc(var(--fs-r, 1) * 18.5px); font-weight: 500; color: rgba(var(--rgb-diff),.90); letter-spacing: .01em; font-family: var(--ff-main); }
.ax-top-wm b { color: var(--muted); font-weight: 700; }
@media (min-width: 1000px) { .ax-top-brand { display: none; } }

.ax-shell { position: relative; }
.ax-overlay { position: fixed; inset: 0; z-index: 9899; background: rgba(var(--rgb-diff),.18); backdrop-filter: blur(6px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s var(--ease), visibility .4s; }
.ax-overlay.on { opacity: 1; visibility: visible; pointer-events: auto; }

/* ═══ TOPBAR PANELS · APPS · PROFILE (exatos do showcase) ═══ */
.panel-r { position: fixed; top: 56px; right: 0; bottom: 0; width: clamp(300px,92vw,396px); z-index: 9800; background: var(--bg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .48s var(--ease); box-shadow: -4px 0 32px rgba(var(--rgb-diff),.06); }
.panel-r.open { transform: translateX(0); }
.panel-r-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0px; flex-shrink: 0; }
.panel-r-title { font-family: var(--ff-heading); font-size: calc(var(--fs-r, 1) * var(--fs-h6)); color: var(--txt-heading); font-weight: 700; }
.panel-r-body { flex: 1; overflow-y: auto; padding: 0px 8px 40px; scrollbar-width: none; -ms-overflow-style: none; }
.panel-r-body::-webkit-scrollbar { display: none; width: 0; height: 0; }
.apps-pop { position: fixed; top: calc(56px + 6px); right: 6px; width: 420px; max-width: calc(100vw - 12px); background: rgba(var(--rgb-theme),.25)!important; backdrop-filter: blur(20px) saturate(180%) !important; -webkit-backdrop-filter: blur(20px) saturate(180%) !important; box-shadow: inset 0 1px 0 0 rgba(var(--rgb-theme),.9), inset 0 0 0 1px rgba(var(--rgb-theme),.4); border: 1px solid rgba(var(--rgb-diff),.04); border-radius: var(--r); z-index: 9801; padding: 10px 8px 12px; transform: translateY(-8px) scale(.97); opacity: 0; pointer-events: none; transition: transform .28s var(--ease), opacity .22s var(--ease); }
.apps-pop.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.apps-pop-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.apps-pop-close { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--muted); cursor: pointer; font-size: calc(var(--fs-r, 1) * 15px); }
.apps-pop-close:hover { background: var(--surface); color: var(--txt-heading); }
.apps-pop-title { font-family: var(--ff-mono); font-size: calc(var(--fs-r, 1) * 9px); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); padding: 2px 6px 9px; }
.apps-grid { display: grid; grid-template-columns: repeat(4,24.9%); gap: 3px; }
.app-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 4px; border-radius: var(--r-sm); cursor: pointer; text-decoration: none; color: var(--txt-color); transition: background .25s var(--ease), color .2s var(--ease); }
.app-cell:hover > .app-icon { background: var(--surface-hover); color: var(--txt-heading); }
.app-icon { aspect-ratio: 1/1; width: 100%; height: auto; border-radius: var(--r-sm); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: calc(var(--fs-r, 1) * 17px); color: var(--txt-heading); box-shadow: inset 0 1px 0 0 rgba(var(--rgb-theme),.9), inset 0 0 0 1px rgba(var(--rgb-theme),.4); border: 1px solid rgba(var(--rgb-diff),.04); }
.app-cell span { font-family: var(--ff-mono); font-size: calc(var(--fs-r, 1) * 9.5px); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.profile-panel-top { padding: 0px 18px 16px; text-align: center; }
.profile-panel-av { width: 120px; height: 120px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-family: var(--ff-mono); font-size: calc(var(--fs-r, 1) * 16px); font-weight: 700; color: var(--txt-heading); box-shadow: inset 0 1px 0 0 rgba(var(--rgb-theme),.9), inset 0 0 0 1px rgba(var(--rgb-theme),.4); border: 1px solid rgba(var(--rgb-diff),.04); }
.profile-panel-name { font-family: var(--ff-heading); font-size: calc(var(--fs-r, 1) * 16px); color: var(--txt-heading); font-weight: 700; }
.profile-panel-role { font-size: calc(var(--fs-r, 1) * 12px); color: var(--muted); margin-top: 2px; }
.profile-panel-actions { display: flex; flex-direction: column; gap: 2px; padding: 10px 10px 28px; }
.profile-action { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--r-sm); cursor: pointer; color: var(--txt-color); font-size: calc(var(--fs-r, 1) * 12.5px); transition: background .28s var(--ease), color .28s var(--ease); }
.profile-action i, .profile-action svg { font-size: calc(var(--fs-r, 1) * 17px); width: calc(var(--fs-r, 1) * 17px); color: var(--muted); flex-shrink: 0; transition: color .28s var(--ease); }
.profile-action:hover { background: var(--surface-hover); color: var(--txt-heading); }
.profile-action:hover i { color: var(--txt-heading); }
.profile-action.danger:hover { background: rgba(255,107,107,.07); color: var(--alert-red); }
.profile-action.danger:hover i { color: var(--alert-red); }
/* .profile-action is a <button> for the Suporte trigger — strip UA chrome so it
   sits flush with its <a> siblings (showcase renders them identically). */
button.profile-action { width: 100%; border: 0; background: none; font-family: inherit; text-align: left; }
</style>

<style id="apollo-plus-aside">
/* ── Shell frame ─────────────────────────────────────────────────────────── */
.ax-aside{position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:9902;background:rgba(var(--rgb-theme),.8);backdrop-filter:blur(100px);-webkit-backdrop-filter:blur(100px);display:flex;transform:translateX(-100%);transition:transform .45s var(--ease-snappy)}
.ax-aside.open{transform:translateX(0)}
.ax-main{padding:0;width:100%;max-width:none;min-width:0;box-sizing:border-box;overflow-x:clip;--ax-pad-x:0px;margin-left:0;margin-right:0;padding-left:0!important}

/* Kill the legacy 601px "desktop" offset — the aside only pins at 1000px+ */
@media (min-width:601px) and (max-width:999px){
  .ax-main{padding-left:0!important;padding-right:0!important;margin-left:0!important;margin-right:0!important;width:100%!important;--ax-pad-x:0px!important}
}
@media (min-width:1000px){
  .ax-burger{display:none}
  .ax-shell,.ax-body{--aside-w:clamp(200px,20vw,225px)}
  .ax-aside{top:0;left:0;bottom:0;height:100dvh;width:var(--aside-w);transform:none}
  .ax-overlay{display:none}
  .ax-main{margin-left:calc(12px + var(--aside-w) + clamp(24px,5vw,52px));margin-right:clamp(28px,4.5vw,64px);width:auto!important;max-width:none!important;min-width:0;padding-left:0!important}
}

/* ── Sidebar body ────────────────────────────────────────────────────────── */
.s{display:flex;flex-direction:column;width:100%;height:100dvh;min-height:100%;font-size:calc(var(--fs-r,1)*11px);color:rgba(var(--rgb-diff),.66);text-align:left;overflow:hidden;position:relative;--aside-pad-x:12px;--aside-row-gap:9px}
.s .ni,.s .si,.s .fr,.s .fni,.s .adj,.s .urow{min-width:0;max-width:100%;box-sizing:border-box}
.s .sn,.s .fn,.s .un,.s .uro{display:block;min-width:0;flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si,.fr{width:100%;max-width:100%}
.si .cnt,.fr .fd,.s .ni>i,.s .si>i,.s .fr>i,.s .fni>i,.s .um,.s .pill,.tog{flex-shrink:0}
.si .cnt{margin-left:auto}
@media (max-width:1000px){.s{border-radius:0}}

.s .hd{padding:20px 14px 15px 20px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.s .lg{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s .lg i{font-size:calc(var(--fs-r,1)*22px);transform:translateY(2px);color:var(--white-7)}
.s .lg i svg{width:1em;height:1em;display:inline-block}
.s .wm{font-size:calc(var(--fs-r,1)*16.5px);font-weight:500;color:var(--gray-18);letter-spacing:.01em}
.s .wm b{color:var(--white-13);font-size:80%;font-weight:900;font-family:sans-serif}

.ax-aside-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.ax-aside-scroll::-webkit-scrollbar{display:none;width:0;height:0}

/* ── Primary nav ─────────────────────────────────────────────────────────── */
.nb{padding:5px 8px}
.ni{display:flex;align-items:center;gap:var(--aside-row-gap);padding:8px var(--aside-pad-x);cursor:pointer;margin-bottom:2px;color:rgba(var(--rgb-diff),.60);font-size:calc(var(--fs-r,1)*13px);border-radius:var(--r-sm);position:relative;text-decoration:none}
.ni .sn{font-size:inherit;color:inherit;font-weight:inherit}
.ni i{font-size:calc(var(--fs-r,1)*16px);flex-shrink:0;opacity:.46}
.ni:hover{color:rgba(var(--rgb-diff),.90);background:rgba(var(--rgb-diff),.03)}
.ni:hover i{opacity:.9}
.ni.on{color:rgba(var(--rgb-diff),.90);background:rgba(var(--rgb-diff),.04);box-shadow:inset 0 1px 0 0 rgba(var(--rgb-theme),.35),inset 0 0 0 1px rgba(var(--rgb-theme),.085)}
.ni.on i{opacity:1}

.sh{display:flex;align-items:center;justify-content:space-between;padding:8px var(--aside-pad-x) 2px;cursor:pointer;user-select:none}
.sh:hover{opacity:.72}
.slbl{font-family:var(--ff-mono);font-size:calc(var(--fs-r,1)*9.5px);letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--rgb-diff),.35)}
.tog{transition:transform .3s var(--ease)}

.si{display:flex;align-items:center;gap:var(--aside-row-gap);padding:7px var(--aside-pad-x);cursor:pointer;font-size:calc(var(--fs-r,1)*12.5px);color:rgba(var(--rgb-diff),.60);border-radius:var(--r-xs);margin:0 4px;text-decoration:none}

/* ── Footer: Suporte · Ajustes · user ────────────────────────────────────── */

<style id="apollo-pev-browse">

<style id="apollo-pev-hero">
/* ── Layout: mobile column → desktop hero+sidebar ──────────────────────────
   Gaps and gutters come from the `--pev-*` rhythm contract in
   styles-rhythm.php (era styles-masthead.php até 1.7.0) — do not hard-code
   them here. ── */
.pev-layout {
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

.pev-hero {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  min-height: clamp(232px, 54vw, 292px);
  background: var(--surface);
  border: 1px solid rgba(var(--rgb-diff), .04);
  box-shadow: inset 0 1px 0 0 rgba(var(--rgb-theme), .9), inset 0 0 0 1px rgba(var(--rgb-theme), .4);
  cursor: pointer;
  isolation: isolate;
}
.pev-hero-cover {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(.35);
  transition: filter .5s var(--ease), transform .6s var(--ease-smooth);
}
.pev-hero:hover .pev-hero-cover { filter: grayscale(0); transform: scale(1.03); }

/* ── FALLBACK · última camada quando não há destaque ────────────────────────
   Ordem de empilhamento explícita. Antes, o <iframe> e o véu compartilhavam
   z-index:0 e dependiam da ordem do DOM; qualquer reordenação silenciosa do
   markup escondia a mensagem atrás do próprio véu. Agora:
       0 · fundo degradê (sobrevive se o iframe não carregar)
       1 · iframe do CDN
       2 · véu
       3 · corpo da mensagem
   O fundo é a REDE DE SEGURANÇA final: se assets.apollo.rio.br estiver fora do
   ar, o cartão continua legível em vez de virar um retângulo vazio. ── */
.pev-hero.is-fallback {
  cursor: default;
  background:
    radial-gradient(120% 90% at 12% 0%, rgba(255, 255, 255, .05) 0%, transparent 62%),
    linear-gradient(168deg, #1b1b1b 0%, #131313 46%, #0d0d0d 100%);
}
.pev-hero-fallback {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  pointer-events: none;
  color-scheme: dark;
  /* Starts invisible, fades in once 'load' fires (app.php's onload handler).
     This cannot detect an X-Frame-Options block — see the KNOWN LIMITATION
     note in app.php's heroFallbackHTML() — it only removes the flash of blank
     white on first paint while the frame is still resolving. */
  opacity: 0;
  transition: opacity .5s var(--ease);
}
.pev-hero-fallback.is-ready { opacity: 1; }
.pev-hero-fallback-shade {
  position: absolute;
  inset: 0;
  z-index: 2;
  /* Top stop is NOT fully transparent (2026-08-01): if the iframe is blocked
     by the CDN's own X-Frame-Options header (see app.php), the browser paints
     it plain white top-to-bottom. A shade that only darkens the bottom 80%
     left that white showing through the top — this floor keeps the whole card
     toned even when layer 1 never actually renders anything. */
  background:
    linear-gradient(rgba(var(--rgb-diff), .16) 0%, rgba(var(--rgb-diff), .70) 100%),
    radial-gradient(120% 80% at 50% 120%, rgba(0, 0, 0, .34) 0%, transparent 70%);
  pointer-events: none;
}
.pev-hero.is-fallback .pev-hero-body { z-index: 3; }

/* ── HERO SLIDER · destaques (highlight:true) ───────────────────────────────
   Slides empilhados no mesmo box: só o .is-on aparece, com cross-fade + um
   leve zoom-out de entrada (Ken Burns curto) que dá vida sem chamar atenção
   pra si. O clique/foco continua indo pro evento do slide ativo. ── */
.pev-hero.is-slider { display: grid; }
.pev-hero-slide {
  grid-area: 1 / 1;
  position: relative;
  min-height: inherit;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .7s var(--ease), visibility .7s var(--ease);
}
.pev-hero-slide.is-on {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.pev-hero-slide.is-on .pev-hero-cover { animation: pevHeroDrift 7s var(--ease-smooth) both; }
@keyframes pevHeroDrift {
  from { transform: scale(1.07); }
  to   { transform: scale(1); }

.pev-hero-kicker {

  align-items: center;

.pev-hero-kicker i { color: var(--accent); font-size: 1.15em; }

.pev-hero-dots {

  left: 18px;
  right: 18px;

.pev-hero-dot {

  padding: 0;

/* ── Empty hero ──────────────────────────────────────────────────────────────

<style id="apollo-pev-rhythm">

<style id="apollo-pev-lightbox">
/* ═══ 0 · WHY EVERY SELECTOR BELOW IS DOUBLED ═════════════════════════════
   LOAD ORDER IS AGAINST US. This cell ships in <head> (archive-event.php
   buffers portal/styles.php into $extra_head), but the base sheet it overrides,
   assets/css/apollo-single-event.css, is printed by apollo_event_lightbox_boot()
   near the END OF <body>. Later in document order wins a specificity tie, so a
   plain `.ev-lb { z-index: 10500 }` here would be silently beaten by the base
   `.ev-lb { z-index: 9900 }` — the override would look correct in the source
   and do nothing on screen.

   So overrides are written one class heavier (`.ev-lb.ev-lb`, `.ev-lb .ev-lb-x`)
   which wins on SPECIFICITY and is therefore immune to load order. This is
   deliberate, not a typo — do not "clean up" the repetition. Anything that
   must beat the base sheet needs the doubled form; anything genuinely new
   (no base rule to fight) can stay single.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══ 1 · FULL VIEWPORT ═══════════════════════════════════════════════════
   MEASURED Z-INDEX MAP of everything this must clear (2026-08-01 audit):

     .panel-r        9800   topbar profile drawer   ┐
     .apps-pop       9801   apps popup              │ apollo-plus/
     .ax-overlay     9899   shell scrim             │ topbar-styles.php
     .ax-top-blur    9900   topbar blur veil        │ + aside-styles.php
     .ax-top         9901   topbar                  │
     .ax-aside       9902   nav drawer  ← ceiling   ┘
     .pev-rail-modal 9965   portal rail lightbox      styles-rails.php
     .alh-ov--filter 9970   listing-header filter     apollo-templates
     .alh-ov--search 9975   listing-header search     listing-header/kernel-styles.php

   REVISED 2026-08-08: the old top of this table was `.pev-masthead 10070
   (only while filter open)`, from styles-masthead.php. That file and that
   markup are gone — /eventos now uses the apollo_listing_header() block, whose
   two wipe overlays sit at 9970/9975. They are full-screen panels and must
   clear the shell chrome, but they are still page controls, so they stay under
   the single-event reader.

   Highest competitor is now 9975, so 10500 clears the ecosystem with headroom.
   BUT THE NUMBER WAS NEVER THE PROBLEM: the shell is printed inside
   <main class="ax-main">, whose `overflow-x: clip` both clips fixed
   descendants and scopes their stacking context — so .ev-lb was competing
   against .ax-main's children, not against .ax-top. apollo-event-lightbox.js
   now re-parents the shell to <body> on first open (see the PORTAL THE SHELL
   comment there); this z-index only decides the outcome once that is true. */
.ev-lb.ev-lb {
  z-index: 10500;
  align-items: stretch;
  justify-content: stretch;
  --ev-lb-w: 100vw;
  --ev-vw: 100vw;
  /* Root-context overlay: nothing inside may leak out of it either. */
  isolation: isolate;
}
.ev-lb.ev-lb .ev-lb-panel {
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: 100dvh;
  border-radius: 0;
  /* Entry is a lift + settle, not a slide-up sheet: at full-bleed a large
     translate reads as the page lurching. Short, damped, deliberate. */
  transform: scale(.985);
  opacity: 0;
  transition:
    transform .52s var(--ease-smooth, cubic-bezier(.16, 1, .3, 1)),
    opacity .3s var(--ease, ease);
  will-change: transform, opacity;

  /* ── SOLID WHITE READER, BOTH THEMES (2026-08-17) ───────────────────────
     REQUIREMENT: the surface behind a fragment is always solid #fff. Never a
     token that can flip, never rgba with alpha, never a blur that lets the
     page behind read through.

     WHY A LITERAL AND NOT var(--ev-bg). Traced through the live cascade:

       .ev-lb-panel{background:var(--ev-bg)}   apollo-single-event.css:1042
       --ev-bg: var(--white-1)                 apollo-single-event.css:43
       html.dark-mode{--white-1:#0b0b0d}       theme
       html.dark-mode{--rgb-diff:255,255,255}  apollo-auth-uni.css:121
       --ev-ink: rgba(var(--rgb-diff),1)       apollo-single-event.css:45

     So in dark mode the panel was #0b0b0d — near black — and the requirement
     was silently violated on half the installs.

     THE TRAP THIS BLOCK EXISTS TO AVOID: pinning `background` alone gives
     WHITE TEXT ON WHITE, because --ev-ink inverts independently of --ev-bg.
     That renders as a blank panel with a working ✕ — the exact symptom the
     2026-08-07 session chased through two rounds of "verified on disk" fixes
     before finding the stale-asset cause. The whole local --ev-* block has to
     be pinned together or not at all.

     These are COMPONENT-SCOPED custom properties, which the design system
     explicitly blesses (`.pev { --pev-band: … }`). This is not a :root entry
     and must never become one — :root belongs to core.js.

     Values are the light-theme literals from apollo-single-event.css:43-49,
     resolved (--rgb-diff → 10,10,10) rather than referenced, so a theme flip
     cannot reach them.

     TRADE-OFF, STATED: dark-mode readers get a light document panel. That is
     deliberate — the fragment is a document, not chrome. Revisit here, in one
     block, if it ever changes. */
  --ev-bg:    #fff;
  --ev-ink:   rgba(10, 10, 10, 1);
  --ev-mute:  rgba(10, 10, 10, .48);
  --ev-faint: rgba(10, 10, 10, .28);
  --ev-line:  rgba(10, 10, 10, .07);
  --ev-line2: rgba(10, 10, 10, .12);
  --ev-soft:  rgba(10, 10, 10, .035);
  background: #fff;
}
.ev-lb.ev-lb.is-open .ev-lb-panel { transform: none; opacity: 1; }

/* The base sheet's own @media (min-width:720px) re-centres and re-rounds the
   panel into a 560px card. At full-bleed neither applies — and this must
   out-specify it, not merely follow it. */
@media (min-width: 720px) {
  .ev-lb.ev-lb { align-items: stretch; }
  .ev-lb.ev-lb .ev-lb-panel {
    height: 100dvh;
    max-height: 100dvh;
    border-radius: 0;
    box-shadow: none;
  }
}

/* Backdrop: OPAQUE WHITE, no alpha, no blur.
   The old value was rgba(var(--rgb-diff),.72). The comment above it claimed
   "nothing shows through a full-bleed panel" — true once the panel is open,
   false for the ~520ms it is still transitioning from opacity:0. During those
   frames the backdrop IS the surface, and at .72 alpha the page underneath
   read through it. Same requirement as the panel, same reason, same literal. */
.ev-lb.ev-lb .ev-lb-bd {
  background: #fff;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* ═══ 2 · CLOSE CONTROL — bare glyph, auto-inverting ══════════════════════
   Your call, and it is the right one. `mix-blend-mode: difference` with a
   white glyph subtracts the backdrop from white, so the ✕ renders as the exact
   photographic inverse of whatever is behind it: black on the white DJ section,
   white on the dark hero, always separated — with no plate, no scrim and no
   drop-shadow. It cannot be low-contrast, because "same colour as the
   backdrop" would require the backdrop to be mid-grey in every channel at
   once, and even then grayscale(1) keeps the result neutral rather than
   letting a saturated cover tint the glyph.

   Two requirements this depends on, both satisfied:
     · Blending needs a stacking context to blend WITHIN, or it would reach
       past the panel — .ev-lb now sets `isolation: isolate`.
     · `filter` and `mix-blend-mode` on one element compose in that order
       (filter first, then blend), which is what we want. The old
       drop-shadow is gone — a shadow under an inverting glyph fights it. */
.ev-lb.ev-lb .ev-lb-x {
  top: calc(14px + var(--ev-st, 0px) + var(--safe-top, 0px));
  right: clamp(12px, 2.4vw, 22px);
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  background-color: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: none;
  color: #fff;
  font-size: 28px;
  line-height: 1;
  mix-blend-mode: difference;
  filter: grayscale(1);
  transition:
    transform .28s var(--ease-snappy, cubic-bezier(.34, 1.16, .64, 1)),
    opacity .2s var(--ease, ease);
}
/* Safari < 15.4 ignores mix-blend-mode on a filtered element; the glyph would
   render plain white. A hairline text-shadow keeps it legible there without
   affecting browsers where the blend works (difference swallows it). */
@supports not (mix-blend-mode: difference) {
  .ev-lb.ev-lb .ev-lb-x { text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
}
.ev-lb.ev-lb .ev-lb-x i,
.ev-lb.ev-lb .ev-lb-x svg { font-size: inherit; color: inherit; fill: currentColor; }
.ev-lb.ev-lb .ev-lb-x:hover { transform: scale(1.1); opacity: .82; background: none; }
.ev-lb.ev-lb .ev-lb-x:active { transform: scale(.92); }
.ev-lb.ev-lb .ev-lb-x:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 75%, transparent);
  outline-offset: 4px;
  border-radius: var(--r-sm);
}

/* ═══ 3 · SCROLL SURFACE ══════════════════════════════════════════════════ */
/* The panel is its OWN scroll container and carries data-lenis-prevent (see
   apollo_event_lightbox_shell()), so Lenis leaves its wheel/touch events alone
   and the browser scrolls it natively.
   · overscroll-behavior:contain — reaching the end must not chain out and
     scroll the locked document behind.
   · touch-action:pan-y — iOS Safari otherwise hands vertical drags to the
     page once Lenis has released them.
   · scroll-behavior:auto — a CSS smooth-scroll here would fight both the
     native momentum and ScrollTrigger's measurements. */
.ev-lb.ev-lb .ev-lb-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  scroll-behavior: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.ev-lb.ev-lb .ev-lb-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
.ev-lb.ev-lb .ev-lb-scroll:focus { outline: none; }
/* Nothing inside may trap the gesture with its own scroll container. */
.ev-lb.ev-lb .ev-lb-body { min-height: 100%; }

/* ── Content entry ───────────────────────────────────────────────────────────
   Pairs with the two-rAF class flip in apollo-event-lightbox.js's inject().
   The PANEL glides in empty while the fragment is still in flight; without
   this the fragment then paints in one frame and the eye reads a hard cut
   mid-glide ("stairs"). A short rise+fade on the filled body turns the seam
   into one continuous movement.

   Deliberately SHORT (.34s) and small (10px): the panel is already moving, so
   a long content animation would read as two competing motions rather than
   one. filter/blur is avoided — it would repaint the whole fragment every
   frame on a panel that may hold a map and a slider. */
.ev-lb.ev-lb .ev-lb-body {
  opacity: 0;
  transform: translate3d(0, 10px, 0);
  transition:
    opacity .34s var(--ease, ease),
    transform .34s var(--ease-smooth, cubic-bezier(.16, 1, .3, 1));
  will-change: opacity, transform;
}
.ev-lb.ev-lb .ev-lb-body.is-entered {
  opacity: 1;
  transform: none;
}
/* Once settled, drop the compositor hint — the panel can hold a Leaflet map
   and a GSAP rail, and a permanent will-change on their container keeps a
   layer alive for the whole session. */
.ev-lb.ev-lb .ev-lb-body.is-entered { will-change: auto; }

@media (prefers-reduced-motion: reduce) {
  .ev-lb.ev-lb .ev-lb-body { transition: none; opacity: 1; transform: none; }
}

/* ═══ 4 · NO TEXT SELECTION ANYWHERE INSIDE ══════════════════════════════ */
/* The lightbox is an app surface, not a document: drag-select produced blue
   highlight smears across the hero and the fact rows during scroll gestures.
   Inputs and textareas are deliberately exempt — a form the user cannot type
   into is a worse bug than the one being fixed. */
.ev-lb.ev-lb,
.ev-lb.ev-lb * {
  -webkit-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none;
}
.ev-lb.ev-lb input,
.ev-lb.ev-lb textarea,
.ev-lb.ev-lb [contenteditable="true"],
.ev-lb.ev-lb [contenteditable="true"] * {
  -webkit-user-select: text !important;
  -moz-user-select: text !important;
  -ms-user-select: text !important;
  user-select: text !important;
}

/* ═══ 5 · REVEALS MUST NEVER STRAND CONTENT ══════════════════════════════ */
/* .ev-reveal ships opacity:0 + translateY(28px) and depends on ScrollTrigger
   to clear it. Inside the panel the scroller is not the window, so a trigger
   that never resolves used to leave whole sections permanently invisible —
   content present in the DOM, unreadable on screen.
   The panel gets a CSS floor: once .is-open settles, reveals are visible by
   default. GSAP still animates them (inline styles win over this rule), so the
   motion is unchanged when it works — this only guarantees the end state. */
/* GENERATED FROM APOLLO_EVENT_REVEAL_FLOOR (P3, 2026-08-07).
   This block used to be a hand-maintained copy of a selector list that also
   lived in apollo-single-event.js and bootstrap.php, each carrying a "keep in
   sync" comment. It is now emitted from the PHP constant those two also read
   at runtime, so adding a part to the single-event template cannot leave the
   floor behind. Contract + rationale: includes/render-single.php.

   NOTE this is the pre-mount / belt-and-braces layer only. The root fix is
   apollo-single-event.js passing `scroller` to every ScrollTrigger it creates
   so reveals resolve against this panel instead of the window. GSAP writes
   inline styles, which outrank this rule, so enter/leave motion is unaffected
   — this only guarantees the element is never stranded unreadable. */
.ev-lb.ev-lb.is-open .ev-reveal,
.ev-lb.ev-lb.is-open .ev-fact,
.ev-lb.ev-lb.is-open .ev-panel,
.ev-lb.ev-lb.is-open [data-ev="access"],
.ev-lb.ev-lb.is-open [data-ev="about"],
.ev-lb.ev-lb.is-open .ev-spotify,
.ev-lb.ev-lb.is-open .ev-gallery,
.ev-lb.ev-lb.is-open .v-slider,
.ev-lb.ev-lb.is-open .ev-map,
.ev-lb.ev-lb.is-open .ev-vbody,
.ev-lb.ev-lb.is-open .ev-dj,
.ev-lb.ev-lb.is-open [data-reveal-word] { opacity: 1; transform: none; }
/* Belt and braces: bootstrap.php adds this after mount if anything is still
   stranded, and it outranks a stuck inline opacity. */
.ev-lb.ev-lb .ev-force-visible,
.ev-lb.ev-lb .ev-force-visible * {
  opacity: 1 !important;
  visibility: visible !important;
  transform: none !important;
}

/* At full-bleed the embedded hero can use the real viewport again, instead of
   the 78dvh compromise the 560px sheet needed. */
.ev-lb.ev-lb .ev-root.is-embed .ev-hero { height: 92dvh; min-height: 520px; }
.ev-lb.ev-lb .ev-root.is-embed .ev-hero-top { padding-right: 76px; }

/* ═══ 6 · READING COLUMN — the "old mobile" fix ═══════════════════════════
   THE WHITE BAND BELOW THE DJ BLOCK WAS NOT A BUG, IT WAS THE DESIGN — seen
   at the wrong size. apollo-single-event.css is a mobile-first document:

     :root { --ev-max: 440px }                  ·· 500px above 540px wide
     .ev-wrap { width: min(100%, var(--ev-max)); margin-inline: auto }

   On /evento/{slug} at phone width that column IS the page. Inside a
   full-viewport lightbox on a 1440px screen the same rule pins every section
   to a 500px strip centred on --ev-bg (which is white in the light theme), so
   the DJ block down to the footer reads as a narrow phone layout stranded in a
   white void. Nothing was broken; it was a 500px page in a 1440px window.

   --ev-max is a plain custom property, so re-declaring it on .ev-lb re-scopes
   it for everything inside WITHOUT touching :root and without affecting the
   real single page. Component scope, exactly like --pev-band. The column grows
   with the viewport and stops at a sane measure — past ~900px running text
   becomes hard to track, so this widens the layout without wrecking legibility.

   Full-bleed blocks (.v-slider, .ev-map) key off --ev-vw, already set to 100vw
   above, so they still break out edge-to-edge over the wider column. */
@media (min-width: 720px) {
  .ev-lb.ev-lb { --ev-max: clamp(560px, 62vw, 900px); --ev-pad: clamp(28px, 3.4vw, 44px); }
}
@media (min-width: 1200px) {
  .ev-lb.ev-lb { --ev-max: clamp(720px, 58vw, 980px); }
}

/* ═══ 7 · THE "SPARK" ON SCROLL ══════════════════════════════════════════
   `.ev-wrap > * { transition: all .66s ease }` in the base sheet animates
   EVERY animatable property on every direct child. Combined with the reveal
   pass and a late-decoding hero, any layout change — width, height, colour,
   transform, background — cross-fades over 0.66s at once, which is the flash
   of white and the "spark then content appears" during scroll.

   `transition: all` is also a per-frame cost: the engine must diff every
   computed property on every child. Narrowed here to the two properties the
   reveal actually animates. Scoped to the lightbox so /evento/{slug} keeps
   its current behaviour until this is proven there too. */
.ev-lb.ev-lb .ev-wrap > * {
  transition:
    opacity .5s var(--ease, cubic-bezier(.16, 1, .3, 1)),
    transform .5s var(--ease, cubic-bezier(.16, 1, .3, 1));
}
/* A section whose media has not decoded must not collapse to zero and snap
   back — that snap is the other half of the flicker. */
.ev-lb.ev-lb .ev-wrap > * { backface-visibility: hidden; }
.ev-lb.ev-lb img { background: var(--ev-soft, rgba(0, 0, 0, .04)); }

@media (prefers-reduced-motion: reduce) {
  .ev-lb.ev-lb .ev-lb-panel { transition: opacity .2s linear; transform: none; }
  .ev-lb.ev-lb.is-open .ev-lb-panel { transform: none; }
  .ev-lb.ev-lb .ev-lb-x { transition: none; }
}
</style>
